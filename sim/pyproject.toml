[project]
name = "rcnsim"
version = "0.1.0"
description = "Load simulator for realtime-courier-network"
requires-python = ">=3.13"
dependencies = ["asyncpg==0.30.0", "httpx==0.28.1"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["rcnsim"]

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true
python_version = "3.13"

[[tool.mypy.overrides]]
module = "asyncpg"
ignore_missing_imports = true
