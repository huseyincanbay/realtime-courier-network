global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: gateway
    static_configs:
      - targets: ['host.docker.internal:4000']
  - job_name: auth
    static_configs:
      - targets: ['host.docker.internal:3001']
  - job_name: orders
    static_configs:
      - targets: ['host.docker.internal:3002']
  - job_name: location
    static_configs:
      - targets: ['host.docker.internal:3003']
  - job_name: realtime
    static_configs:
      - targets: ['host.docker.internal:3004']
  - job_name: dispatch
    static_configs:
      - targets: ['host.docker.internal:3005']
